version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lexvision_postgres
    environment:
      POSTGRES_DB: lexvision_db
      POSTGRES_USER: lexvision_user
      POSTGRES_PASSWORD: lexvision_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: lexvision_web
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-lexvision-ai-docker-key-2026
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=lexvision_db
      - DB_USER=lexvision_user
      - DB_PASSWORD=lexvision_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
