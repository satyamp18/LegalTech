{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LexVision AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <!-- Logo Header -->
      <div class="text-center mb-4">
        <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none fw-extrabold fs-3 text-primary">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7V12C3 17.52 7.02 22.5 12 24C16.98 22.5 21 17.52 21 12V7L12 2Z" fill="#0F52BA"/>
            <path d="M10 15.5L7.5 13L8.91 11.59L10 12.67L15.09 7.58L16.5 9L10 15.5Z" fill="#ffffff"/>
          </svg>
          LexVision <span class="fw-normal text-slate">AI</span>
        </a>
        <p class="text-muted small mt-1">Enterprise Contract Intelligence Platform</p>
      </div>

      <!-- Login Card -->
      <div class="card-enterprise shadow-lg border-0">
        <div class="card-body-clean p-4">

          <h5 class="fw-bold text-dark mb-3">Account Sign In</h5>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags|default:'danger' }} p-2 small mb-3">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}

          <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label small fw-bold text-dark">Username or Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                <input type="text" name="username" class="form-control" placeholder="admin, lawyer, or paralegal" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small fw-bold text-dark">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6">
              Sign In to LexVision
            </button>
          </form>

          <hr class="my-4">

          <div class="text-center small text-muted">
            Don't have an account? <a href="{% url 'register' %}" class="fw-bold text-primary text-decoration-none">Create Account</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
