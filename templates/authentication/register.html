{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | LexVision AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/animations.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <!-- Logo Header -->
      <div class="text-center mb-4">
        <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none fw-bold fs-3 text-primary-color">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7V12C3 17.52 7.02 22.5 12 24C16.98 22.5 21 17.52 21 12V7L12 2Z" fill="#2563EB"/>
            <path d="M10 15.5L7.5 13L8.91 11.59L10 12.67L15.09 7.58L16.5 9L10 15.5Z" fill="#ffffff"/>
          </svg>
          LexVision <span class="fw-semibold text-primary">AI</span>
        </a>
        <p class="text-secondary small mt-1">Join the Enterprise Legal Technology Platform</p>
      </div>

      <!-- Register Card -->
      <div class="card-enterprise shadow-lg">
        <h3 class="card-title mb-3">Create New Legal Workspace Account</h3>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} p-2 small mb-3">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
          {% csrf_token %}

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="small-label mb-1">First Name</label>
              <input type="text" name="first_name" class="form-input-custom" placeholder="John" required>
            </div>
            <div class="col-6">
              <label class="small-label mb-1">Last Name</label>
              <input type="text" name="last_name" class="form-input-custom" placeholder="Doe" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="small-label mb-1">Username</label>
            <input type="text" name="username" class="form-input-custom" placeholder="johndoe" required>
          </div>

          <div class="mb-3">
            <label class="small-label mb-1">Work Email</label>
            <input type="email" name="email" class="form-input-custom" placeholder="john.doe@firm.com" required>
          </div>

          <div class="mb-3">
            <label class="small-label mb-1">Role Authority</label>
            <select name="role" class="form-select-custom w-100" required>
              <option value="LAWYER" selected>Lawyer / Legal Counsel</option>
              <option value="PARALEGAL">Paralegal / Compliance Specialist</option>
              <option value="ADMIN">Legal Ops Admin</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="small-label mb-1">Password</label>
            <input type="password" name="password" class="form-input-custom" placeholder="••••••••" required>
          </div>

          <div class="mb-4">
            <label class="small-label mb-1">Confirm Password</label>
            <input type="password" name="password_confirm" class="form-input-custom" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-enterprise btn-primary-custom w-100">
            Create Account
          </button>
        </form>

        <hr class="my-4" style="border-color: #E5E7EB;">

        <div class="text-center small text-secondary">
          Already registered? <a href="{% url 'login' %}" class="fw-semibold text-primary-color text-decoration-none">Sign In</a>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
