{% if messages %}
<div class="messages-container mb-4">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show border-0 shadow-sm mb-2" role="alert">
      <div class="d-flex align-items-center">
        {% if message.tags == 'error' or message.tags == 'danger' %}
          <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        {% elif message.tags == 'success' %}
          <i class="bi bi-check-circle-fill me-2 fs-5"></i>
        {% elif message.tags == 'warning' %}
          <i class="bi bi-exclamation-diamond-fill me-2 fs-5"></i>
        {% else %}
          <i class="bi bi-info-circle-fill me-2 fs-5"></i>
        {% endif %}
        <div class="fw-medium small">{{ message }}</div>
      </div>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {% endfor %}
</div>
{% endif %}
